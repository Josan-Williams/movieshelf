name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: movieshelf_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: movieshelf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movieshelf_test -d movieshelf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://movieshelf_test:ci-only-password@localhost:5432/movieshelf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
